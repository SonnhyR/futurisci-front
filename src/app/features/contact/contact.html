<section class="contact-hero">
    <div class="container">
        <h1>Contáctanos</h1>
        <p>Cuéntanos tu proyecto y construyamos juntos el futuro</p>
    </div>
</section>

<section class="contact-content">
    <div class="container">
        <div class="contact-grid">
            <div class="contact-info">
                <h2>Hablemos</h2>
                <p>¡Estamos listos para ayudarte a transformar tu negocio con tecnología!</p>

                <div class="info-item">
                    <span class="emoji">📍</span>
                    <span>Caracas, Venezuela</span>
                </div>
                <div class="info-item">
                    <span class="emoji">📧</span>
                    <span>hola&#64;futuristci.com</span>
                </div>
                <div class="info-item">
                    <span class="emoji">📞</span>
                    <span>+58 212 555 1234</span>
                </div>

                <div class="contact-social">
                    <h3>Síguenos</h3>
                    <div class="social-links-list">
                        <a class="social-link instagram" href="https://instagram.com/futuristci" target="_blank"
                            rel="noopener noreferrer" aria-label="Instagram FuturistCI">
                            <span class="social-icon">📸</span>
                            Instagram
                        </a>
                        <a class="social-link tiktok" href="https://www.tiktok.com/@futuristci" target="_blank"
                            rel="noopener noreferrer" aria-label="TikTok FuturistCI">
                            <span class="social-icon">🎵</span>
                            TikTok
                        </a>
                        <a class="social-link threads" href="https://www.threads.net/@futuristci" target="_blank"
                            rel="noopener noreferrer" aria-label="Threads FuturistCI">
                            <span class="social-icon">🧵</span>
                            Threads
                        </a>
                    </div>
                </div>
            </div>

            <div class="contact-form">
                <form (ngSubmit)="onSubmit()">
                    <input type="text" [(ngModel)]="formData.name" name="name" placeholder="Nombre completo" required>
                    <input type="email" [(ngModel)]="formData.email" name="email" placeholder="Correo electrónico"
                        required>
                    <input type="tel" [(ngModel)]="formData.phone" name="phone" placeholder="Teléfono">
                    <textarea [(ngModel)]="formData.message" name="message" placeholder="Cuéntanos sobre tu proyecto"
                        rows="5" required></textarea>
                    <button type="submit" class="btn btn-primary btn-large">Enviar mensaje</button>
                </form>
            </div>
        </div>
    </div>
</section>
